services:
  mlflow-server:
    build: ./mlFlowServer
    ports:
    - "5001:5001"
    volumes:
      - ./mlflow-data:/mlflow
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  fastapi-container:
    build: ./mlService
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5001
    depends_on:
      mlflow-server:
        condition: service_healthy

  forester-web-application:
    build: ./foresterService
    ports:
      - "8080:8080"
    environment:
      - FORESTER_DB_PATH=/app/data/forester.db
      - ConnectionStrings__ForesterConnection=Data Source=/app/data/forester.db
      - FORESTER_KEY_PATH=/app/keys
    volumes:
      - ./forester-data:/app/data
      - ./keys:/app/keys
    depends_on:
      fastapi-container:
        condition: service_started